<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Gleyzer – iOS Games</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #222; line-height: 1.5; }
  h1 { font-size: 1.6em; margin-bottom: 0.2em; }
  .game { padding: 14px 0; border-top: 1px solid #eee; }
  .game h2 { font-size: 1.15em; margin: 0 0 4px; }
  p { margin: 0; color: #555; }
</style>
</head>
<body>
  <h1>Alex Gleyzer</h1>
  <p>Indie games for iPhone.</p>
  <div class="game" style="margin-top:24px">
    <h2>FlipCat Dash</h2>
    <p>A one-tap cat runner. Flip between floor and ceiling, dodge hazards and unlock cute cats.</p>
  </div>
  <div class="game">
    <h2>Dino Rampage</h2>
    <p>Charge and lunge through 60 levels of monsters as an unstoppable dinosaur.</p>
  </div>
</body>
</html>
